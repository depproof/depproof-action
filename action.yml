name: 'depproof — Maven, Gradle, npm, Python & Go Dependency & License Audit'
description: 'Scan Maven, Gradle, npm/pnpm/yarn, Python & Go deps for vulnerabilities & license risk. Transitive resolution, CycloneDX SBOM, PR gate.'
author: 'depproof'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  file:
    description: |
      Single dependency manifest to scan. Mutually exclusive with `files` and `discover`.
      Examples: pom.xml, build.gradle.kts, package-lock.json, poetry.lock, requirements.txt.
    required: false
  files:
    description: |
      Multiple manifests to scan (one per line, or comma-separated). Mutually exclusive with
      `file` and `discover`. Multiple Maven POMs are auto-bundled (children resolve parent
      locally).
    required: false
  discover:
    description: |
      Auto-find manifests under `root`. Default behaviour when no `file` / `files` is given.
      Skips node_modules/, target/, build/, .gradle/, .git/, dist/, out/, vendor/, fixtures.
    required: false
    default: 'true'
  root:
    description: 'Discovery root (only used when discover=true). Default: GITHUB_WORKSPACE.'
    required: false
  exclude:
    description: 'Comma-separated extra glob patterns to add to default excludes.'
    required: false
  fail-on:
    description: 'Severity threshold for failure: critical (default) | high | medium | low | none'
    required: false
    default: 'critical'
  fail-on-cvss:
    description: |
      Also fail on findings whose computed CVSS base score is >= this value (0.0–10.0). OR-ed with
      `fail-on`, so either rule matching fails the build. A finding with no CVSS score never matches
      this rule (absent is not low) — use `fail-on-unknown` for ungraded findings. Unset by default.
    required: false
  fail-on-unknown:
    description: |
      If 'true', also fail on findings that could not be graded at all (no scoreable CVSS vector and
      no severity word). Off by default so an ungraded advisory does not block a build unexpectedly.
    required: false
    default: 'false'
  fail-only-if-fix-available:
    description: |
      If 'true', only findings with a known fix version can fail the build. Narrows every other
      gate rule. Excluded findings are counted and reported in the log, never silently dropped.
      Use when you want the gate to reflect what is actionable today.
    required: false
    default: 'false'
  output-dir:
    description: 'Directory to write per-manifest SBOMs + depproof-summary.json. Default: GITHUB_WORKSPACE.'
    required: false
  html:
    description: 'Also write a self-contained HTML report (depproof-report.html) next to the JSON. Opens offline. Default: true.'
    required: false
    default: 'true'
  report-to:
    description: 'Optional https:// URL of your self-hosted depproof-hub to POST the report to (e.g. https://hub.example.com/api/v1/scans). Requires report-token.'
    required: false
  report-token:
    description: 'Ingest token for report-to (pass a secret). Forwarded to the engine only via $DEPPROOF_REPORT_TOKEN, never on the command line.'
    required: false
  report-required:
    description: "If 'true', a failed upload fails the build (engine exit 3). Default: best-effort (warn only)."
    required: false
    default: 'false'
  enrich-online:
    description: |
      If 'true', apply exploitation data from your self-hosted hub at scan time, so it reaches the
      gate, the HTML report and the SBOM. Requires report-to + report-token. See `enrich-mode` for
      how it is fetched. Fail-closed: if the hub is unreachable and a gate rule depends on it, the
      build stops rather than reporting a clean result on data it never received.
    required: false
    default: 'false'
  detect-online:
    description: |
      If 'true', get vulnerability advisories from your self-hosted hub instead of querying OSV.dev,
      and match versions on the runner. Requires report-to + report-token.

      This is the only mode that works with NO route to OSV.dev at all: the hub mirrors the exports
      on a schedule and the scan makes no outbound call to them. The request sends package names
      WITHOUT versions, so the hub cannot match even in principle and never learns which versions you
      run.

      Fail-closed: an unreachable hub, a refused credential or an ecosystem the hub has never
      mirrored is reported as blocked with every affected component named — never as zero findings.
      A stale mirror degrades the scan and says so.

      Note it is a different matcher from OSV.dev's, so the same commit can produce slightly
      different findings than the default path. Leave it off unless egress to OSV.dev is the problem
      you are solving.
    required: false
    default: 'false'
  licenses-online:
    description: |
      If 'true', your self-hosted hub answers declared-licence lookups instead of each runner
      querying the licence sources directly. Requires report-to + report-token.

      Two things this buys. Repositories that share dependencies stop paying separately for the same
      lookups, so licence resolution that was slow on a large dependency graph becomes fast once
      another repository has already asked. And a slow or unavailable source degrades in one place
      rather than in every build at once.

      Independent of enrich-online and of enrich-mode: licences and exploitation data travel
      separately, so either can come from the hub without the other.

      Fail-closed. With the hub answering, it is the only place licences are fetched from — a
      component it cannot answer for is reported as unchecked, never as one that declares no licence.
      Those two look identical in a report and mean opposite things to a compliance reviewer.
    required: false
    default: 'false'
  enrich-mode:
    description: |
      How enrichment is fetched. Both are supported and differ in privacy, not quality.

      'bulk' (default) — the hub sends the whole known-exploited catalogue and the scan matches it
      locally, so the hub is never told which vulnerabilities your repo has. Covers KEV only: the
      EPSS catalogue is ~355,000 entries, far too large to ship on every run.

      'targeted' — the scan sends its finding ids and gets back only those. Required for
      `fail-on-epss`, and gives you a precise per-scan record on the hub. The trade is that the hub
      learns which vulnerabilities you have.
    required: false
    default: 'bulk'
  fail-on-epss:
    description: |
      Also fail on findings whose modelled exploitation probability is >= this value (0.0-1.0).
      Severity says how bad a vulnerability could be; this says how likely it is to be exploited —
      so a medium at 0.98 outranks a high nobody is attacking. Requires enrich-online with
      enrich-mode 'targeted'. A finding with no score never matches.
    required: false
  fail-on-kev:
    description: |
      If 'true', fail the build on findings listed as known-exploited, regardless of severity. Many
      actively-exploited vulnerabilities are rated only medium, so a severity threshold alone lets
      them merge. Requires enrich-online. Not narrowed by fail-only-if-fix-available — a
      known-exploited finding with no fix is the most urgent one in the report.
    required: false
    default: 'false'
  ignore-scope:
    description: |
      Dependency scopes whose findings cannot fail the build (comma-separated). Off by default.

      `development` is the usual one. A test-only dependency is not in the artifact you ship, so a
      build going red on a `junit` finding that the dashboard's shipping filter hides is two tools
      telling a team different things — and the one they stop believing is the stricter one.

      Unlike `fail-only-if-fix-available` this narrows EVERY rule, KEV included: scope is about
      whether the code is exposed at all, which is uniform across rules, and a flag that still went
      red on a known-exploited finding in `junit` would not do what you turned it on for. The
      counterweight is that suppressed findings are listed by name and manifest in the log, and a
      suppressed known-exploited finding is called out separately on stderr.

      A scope nobody determined is NEVER suppressed, and `undetermined` is rejected as a value: it
      is the absence of a scope, not one. Every run prints the scope breakdown of its findings, so
      you can see what this would cost before you turn it on.

      Findings are still scanned, reported, pushed to the hub and present in the SBOM — this changes
      the GATE only.
    required: false

  internal:
    description: |
      YOUR OWN packages, published to a private registry rather than a public one (comma-separated
      globs). Off by default.

      Matched against `groupId:artifactId`, or the bare package name where the ecosystem has no
      group. `*` matches within a segment, `**` across. For example:
      `com.acme.internal:*,@acme/*,github.acme.internal/**`

      No public advisory source has ever held a record of your private library, so screening it
      against one and finding nothing is not a clean result — it is a question nobody asked.
      Declaring it here makes the scan say so: these packages are never screened, and every one is
      reported as UNKNOWN status rather than counted as clean. The SBOM stops asserting they came
      from Maven Central or PyPI too, which matters in a document whose whole job is provenance.

      **These never fail the build.** Not the severity rules, not `require-fidelity`, not
      `require-enrichment`. No action available to you clears the condition — you cannot publish a
      private library to a public registry, and this scanner cannot read your registry — so a gate
      that failed on it would be a gate you had to switch off, which would cost you everything else
      it catches. Status unknown is reported, never enforced.

      You do NOT need this for code inside the repository being scanned. A Maven reactor sibling, a
      Gradle `project(':core')`, a Go `replace` onto a local path, a Python `-e ./libs/core` and an
      npm workspace member are all detected automatically and marked first-party — another manifest
      in the same scan already covers them.

      Nothing is inferred: an undeclared private package stays third-party and is screened, which
      over-reports rather than going quiet. If you report to a depproof-hub, an internal dependency
      is also matched against what your other repositories publish, so it resolves either to the
      repo that builds it or to "no scanned repo publishes this" — a gap you can act on.
    required: false

  require-fidelity:
    description: |
      Fail the build when a manifest's dependency graph could not be fully resolved: 'resolved',
      'partial', or 'off' (default).

      This is the only rule that can fail a build with an EMPTY findings list, which is the point.
      A bare build.gradle is read statically — versions supplied by a BOM, platform or plugin are
      not applied, so those dependencies and everything beneath them can be absent from the report
      with no error to show for it. A short findings list from such a scan is not evidence that
      nothing is wrong.

      'resolved' requires a lockfile or a real resolver everywhere (see "Getting an exact Gradle
      graph" in the README). 'partial' still allows named gaps — an artifact on a repository the
      scanner may not contact — but rejects a graph that was never resolved at all.
    required: false
    default: 'off'
  require-enrichment:
    description: |
      Fail the build when a source that PRODUCES findings could not be reached: 'complete' or 'off'.

      Left unset, this follows your findings gate: if any fail-on rule is active a blocked source
      fails the build, because a screen that never ran cannot support a verdict. With
      `fail-on: none` there is no verdict to corrupt, so it does not fire. Set 'complete' to enforce
      it even in report-only mode, or 'off' to opt out entirely.

      Only STRUCTURAL refusals fail — a proxy denying egress, a mirror that does not serve your
      ecosystem, credentials gone. A rate limit or timeout is retried inside the scanner and then
      reported as a lower bound, because waiting is the right answer to a 429 and a gate that
      reddens on one is a gate somebody switches off.

      The exit code is 4, deliberately distinct from the 1 a findings failure produces: "never
      asked" is not "answered badly", and a wrapper reading the code has to be able to tell them
      apart. Note this is the third rule that can fail a build with an EMPTY findings list — and the
      one where an empty list is least trustworthy.
    required: false
    default: ''
  policy-online:
    description: |
      If 'true', fetch your organisation's gate policy from your self-hosted hub (report-to) at scan
      time, so gating is set once centrally instead of copy-pasted into every repository's YAML.
      Requires report-to + report-token.

      Fail-closed, and note which direction that is: if the hub cannot be reached NO org policy is
      applied and the scanner falls back to its own defaults — which are the strict ones. An outage
      can never quietly relax your gate, and it can never quietly tighten it either.

      An org policy is published in one of two modes. In WARN it is reported but enforces nothing,
      so you can see what it would do across the estate before anything goes red; in ENFORCE it is
      passed to the gate. That distinction exists because this arrow points the opposite way from
      `waivers-online`: a waiver set can only ever loosen a gate, while an org policy can tighten one
      across every pipeline you run, from a single change, with no staged rollout.

      A policy value set directly on this Action (for example `require-enrichment`) always wins — a
      repository can opt into something stricter than the org requires, never weaker.
    required: false
    default: 'false'
  waivers-online:
    description: |
      If 'true', fetch the active waiver set from your self-hosted hub (report-to) at scan time and
      suppress centrally-waived findings from the CI gate (the SBOM/report stay raw). Requires
      report-to + report-token. Fail-closed: if the hub is unreachable, no waivers are applied and
      the gate stays strict.
    required: false
    default: 'false'
  go-online:
    description: |
      For Go modules, run `go list -m -json all` on the runner (when `go` is available) to resolve the
      exact module graph instead of statically parsing `go.mod`. Best-effort: falls back to the static
      `go.mod` parse if `go` is missing or the command fails. Default: true.
    required: false
    default: 'true'
  job-summary:
    description: |
      Render the findings to the workflow run page ($GITHUB_STEP_SUMMARY). Without this the scan's
      output lives only in files in the workspace, which are discarded when the runner is torn down
      unless the caller uploads them — so a failing build shows a red check and nothing else.
      Needs no permissions and works on every repository, public or private. Default: true.
    required: false
    default: 'true'
  pr-comment:
    description: |
      Post the same summary as a single comment on the pull request, updated in place on each run
      rather than appended (so a busy PR gets one comment, not twenty). 'auto' posts only on
      pull_request events, 'false' disables it. Requires `pull-requests: write`; without that
      permission the step warns and the build is unaffected — a comment is never worth failing a
      build over.
    required: false
    default: 'auto'
  github-token:
    description: 'Token used to post the PR comment. Defaults to the workflow token.'
    required: false
    default: ${{ github.token }}

# Composite action: shell-builds the depproof args based on inputs, then invokes the Docker image
# via `docker run`. We don't use the simpler `runs: docker` form because it can't conditionally
# pass args based on which input the user provided.
runs:
  using: 'composite'
  steps:
    - name: Run depproof
      shell: bash
      env:
        # Secret via env (not script interpolation) so it never lands in a log or command line.
        DEPPROOF_REPORT_TOKEN: ${{ inputs.report-token }}
        INPUT_REPORT_TO: ${{ inputs.report-to }}
        INPUT_REPORT_REQUIRED: ${{ inputs.report-required }}
        INPUT_WAIVERS_ONLINE: ${{ inputs.waivers-online }}
        INPUT_POLICY_ONLINE: ${{ inputs.policy-online }}
        INPUT_REQUIRE_ENRICHMENT: ${{ inputs.require-enrichment }}
        INPUT_ENRICH_ONLINE: ${{ inputs.enrich-online }}
        INPUT_DETECT_ONLINE: ${{ inputs.detect-online }}
        INPUT_LICENSES_ONLINE: ${{ inputs.licenses-online }}
        INPUT_ENRICH_MODE: ${{ inputs.enrich-mode }}
        INPUT_GO_ONLINE: ${{ inputs.go-online }}
        # Consumed by `gh` for the PR comment only. Scoped to this step like every other credential.
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail

        # Default outputs to the workspace so artifacts are easy to upload as build artifacts.
        OUTPUT_DIR="${{ inputs.output-dir }}"
        OUTPUT_DIR="${OUTPUT_DIR:-${GITHUB_WORKSPACE}}"
        ROOT="${{ inputs.root }}"
        ROOT="${ROOT:-${GITHUB_WORKSPACE}}"

        # Build the depproof args based on which input was provided.
        ARGS=("scan")

        FILE="${{ inputs.file }}"
        FILES="${{ inputs.files }}"
        DISCOVER="${{ inputs.discover }}"

        if [ -n "$FILE" ] && [ -n "$FILES" ]; then
          echo "::error::depproof-action: 'file' and 'files' are mutually exclusive"; exit 2
        fi

        if [ -n "$FILE" ]; then
          ARGS+=("/workspace/$FILE")
        elif [ -n "$FILES" ]; then
          # Accept either newline- or comma-separated.
          echo "$FILES" | tr ',' '\n' | while IFS= read -r line; do
            line="$(echo "$line" | xargs)"  # trim whitespace
            [ -z "$line" ] && continue
            ARGS+=("/workspace/$line")
          done
          # NOTE: the while-loop above runs in a subshell — to actually keep the ARGS list,
          # rebuild it here using process substitution-free expansion.
          mapfile -t EXTRA < <(echo "$FILES" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//;/^$/d' | sed 's|^|/workspace/|')
          ARGS=("scan" "${EXTRA[@]}")
        else
          # Default: discovery mode.
          ARGS+=("--discover" "--root" "/workspace")
        fi

        # CI gate. Rules are OR-ed by the engine; fail-only-if-fix-available narrows all of them.
        ARGS+=("--fail-on" "${{ inputs.fail-on }}")
        if [ -n "${{ inputs.fail-on-cvss }}" ]; then
          ARGS+=("--fail-on-cvss" "${{ inputs.fail-on-cvss }}")
        fi
        if [ "${{ inputs.fail-on-unknown }}" = "true" ]; then
          ARGS+=("--fail-on-unknown")
        fi
        if [ "${{ inputs.fail-only-if-fix-available }}" = "true" ]; then
          ARGS+=("--fail-only-if-fix-available")
        fi
        # Narrows every rule including KEV, unlike the flag above — see the input's description.
        # Passed through verbatim so the engine validates it: a scope word it does not know is a
        # usage error there, which is the right place for it. Silently dropping a typo here would
        # leave a gate the caller believes is scoped and is not.
        if [ -n "${{ inputs.ignore-scope }}" ]; then
          ARGS+=("--ignore-scope" "${{ inputs.ignore-scope }}")
        fi
        # Your own packages on a private registry. Passed verbatim for the same reason as the flag
        # above: the engine owns glob validation, and a pattern silently dropped here would leave a
        # caller believing their internal libraries are declared when they are being screened
        # against a public registry and reported clean.
        if [ -n "${{ inputs.internal }}" ]; then
          ARGS+=("--internal" "${{ inputs.internal }}")
        fi
        ARGS+=("--output-dir" "/workspace/$(realpath --relative-to="$GITHUB_WORKSPACE" "$OUTPUT_DIR" 2>/dev/null || echo .)")

        EXCLUDE="${{ inputs.exclude }}"
        if [ -n "$EXCLUDE" ]; then
          ARGS+=("--exclude" "$EXCLUDE")
        fi

        # Emit the human-readable HTML report unless explicitly disabled.
        if [ "${{ inputs.html }}" = "true" ]; then
          ARGS+=("--html")
        fi

        # Ask the engine for the markdown summary when either surface will show it. The engine
        # renders it, not this Action: it is the component that knows the gate decision with waivers
        # applied, and the result is a file any CI can display.
        if [ "${{ inputs.job-summary }}" = "true" ] || [ "${{ inputs.pr-comment }}" != "false" ]; then
          ARGS+=("--markdown")
        fi

        # Optional push to a self-hosted depproof-hub. Metadata comes from the GitHub context
        # (engine stays headless); the token is forwarded via a valueless -e, never on argv.
        DOCKER_ENV=()
        if [ -n "${INPUT_REPORT_TO:-}" ]; then
          ARGS+=("--report-to" "$INPUT_REPORT_TO" "--report-repo" "${GITHUB_REPOSITORY:-}" \
                 "--report-commit" "${GITHUB_SHA:-}" "--report-branch" "${GITHUB_REF_NAME:-}" \
                 "--report-event" "${GITHUB_EVENT_NAME:-}")
          [ "${INPUT_REPORT_REQUIRED:-false}" = "true" ] && ARGS+=("--report-required")
          DOCKER_ENV=("-e" "DEPPROOF_REPORT_TOKEN")
          if [ -z "${DEPPROOF_REPORT_TOKEN:-}" ]; then
            echo "::warning::depproof-action: report-to is set but report-token is empty — the hub upload will be skipped (set report-required: true to fail the build instead)."
          fi
        fi

        # Go online resolution: when `go` is on the runner, produce the resolved graph as
        # `go.deps.json` next to each `go.mod`. Discovery then prefers `go.deps.json` over `go.mod`.
        #
        # TWO FILES, because neither can be the other:
        #
        #   `go.deps.json` <- `go list -m -json all` — the COMPONENT SET. The exact build list, every
        #      module the build requires, with direct/indirect and `replace` already resolved by Go.
        #   `go.pkgs.json` <- `go list -deps -test -json ./...` — the SCOPE. One object per package,
        #      including the ones pulled in only to compile tests, which is the only place Go records
        #      what ships: `go.mod` does not mark test requirements and `go list -m` lists modules,
        #      not packages, so neither can answer it.
        #
        # BOTH, rather than preferring the package one, because they are not nested. The package
        # stream covers only modules supplying a package the build actually LOADS, and omits every
        # module that is required but never imported from — on a large module graph that can be most
        # of them. It is GOOS-specific besides, since `go list` resolves build constraints, so a Linux
        # runner and a macOS runner do not agree on it. Preferring it would buy scope and silently
        # pay coverage; emitting both keeps the full component set and scopes what it can.
        #
        # The engine merges them: modules the package stream never mentions report no scope rather
        # than a guess. `go.pkgs.json` is a sidecar, not a manifest — nothing scans it on its own.
        #
        # The package command type-checks, so it fails on a tree that does not compile while the
        # module graph still resolves. That is why it is emitted best-effort and separately: a
        # repository that cannot build should lose the scope, not the whole dependency graph.
        #
        # Tier 1 is tried first and is the more fragile of the two: it type-checks the packages, so it
        # fails on a tree that does not build, where tier 2 succeeds from the module graph alone. That
        # is why it falls back rather than replacing — a repository that cannot compile should lose
        # the scope, not the whole dependency graph.
        if [ "${INPUT_GO_ONLINE:-true}" = "true" ]; then
          if command -v go >/dev/null 2>&1; then
            while IFS= read -r gomod; do
              gdir="$(dirname "$gomod")"
              if ( cd "$gdir" && GOFLAGS=-mod=mod go list -m -json all > go.deps.json 2>/dev/null ) \
                 && [ -s "${gdir}/go.deps.json" ]; then
                # The scope sidecar is best-effort ON TOP, never instead: it type-checks, so it fails
                # on a tree that does not compile, and losing it must not cost the dependency graph.
                if ( cd "$gdir" && GOFLAGS=-mod=mod go list -deps -test -json ./... > go.pkgs.json 2>/dev/null ) \
                   && [ -s "${gdir}/go.pkgs.json" ]; then
                  echo "depproof-action: resolved ${gdir}/go.mod — full module list, with scope"
                else
                  rm -f "${gdir}/go.pkgs.json"
                  echo "depproof-action: resolved ${gdir}/go.mod — full module list, no scope ('go list -deps' failed; does the tree build?)"
                fi
              else
                rm -f "${gdir}/go.deps.json" "${gdir}/go.pkgs.json"
                echo "::warning::depproof-action: 'go list' failed in ${gdir} — using the static go.mod parse"
              fi
            done < <(find "${ROOT}" -name go.mod -not -path '*/vendor/*' 2>/dev/null)
          else
            echo "depproof-action: 'go' not on the runner — Go modules use the static go.mod parse"
          fi
        fi

        # Online-mode policy: fetch the org's gate policy from the hub (ADR-0002's reverse arrow) so
        # gating is authored once centrally rather than copy-pasted into every repository.
        #
        # FAIL-CLOSED, and the direction matters. If the fetch fails we apply NO org policy, and the
        # engine falls back to its own defaults — which are already the strict ones. So an outage can
        # neither relax a gate nor redden an estate. That is the opposite hazard from waivers-online
        # below: a waiver set can only ever loosen, while this can tighten every pipeline at once.
        #
        # We read `.apply`, not `.policy`. The server resolves WARN vs ENFORCE, so those semantics
        # live in one place instead of being re-derived by every consumer — a client reading
        # `.policy` and enforcing it would ignore WARN and redden the estate it was meant to survey.
        if [ "${INPUT_POLICY_ONLINE:-false}" = "true" ]; then
          if [ -z "${INPUT_REPORT_TO:-}" ] || [ -z "${DEPPROOF_REPORT_TOKEN:-}" ]; then
            echo "::warning::depproof-action: policy-online needs report-to + report-token — skipping (scanner defaults apply)."
          else
            POLICY_URL="${INPUT_REPORT_TO%/scans}/policy"
            POLICY_FILE="${RUNNER_TEMP:-/tmp}/.depproof-policy.json"
            if curl -fsS --max-time 20 \
                 -H "Authorization: Bearer ${DEPPROOF_REPORT_TOKEN}" \
                 "${POLICY_URL}?repo=${GITHUB_REPOSITORY:-}" \
                 -o "${POLICY_FILE}"; then
              # Parsed by a script rather than inline: the value can legitimately be JSON null, and
              # a regex that cannot tell null from the string "null" would turn "the org stated
              # nothing" into a flag value the engine rejects as a usage error.
              ORG_REQUIRE_ENRICHMENT="$(bash "${{ github.action_path }}/scripts/read_policy.sh" "${POLICY_FILE}" apply.requireEnrichment)"
              export ORG_REQUIRE_ENRICHMENT
              POLICY_MODE="$(bash "${{ github.action_path }}/scripts/read_policy.sh" "${POLICY_FILE}" policy.mode)"
              echo "depproof-action: org policy fetched from ${POLICY_URL} (mode=${POLICY_MODE:-unknown})"
              if [ "${POLICY_MODE}" = "WARN" ]; then
                # Precise wording, because the obvious phrasing is wrong. WARN means the ORG POLICY is
                # not applied — it does NOT mean nothing is enforced. The scanner's own defaults still
                # run, and for a control whose default is already strict (require-enrichment) a build
                # in WARN can still legitimately go red. Saying "not enforced" beside an exit 4 would
                # send someone hunting a bug that is not there.
                echo "::notice::depproof-action: the org gate policy is in WARN mode — published but not applied. The scanner's own defaults still apply, so a build can still fail."
              fi
            else
              echo "::warning::depproof-action: could not fetch the org policy from the hub — scanner defaults apply (fail-closed)."
            fi
          fi
        fi

        # Online-mode waivers: fetch the active waiver set from the hub and pass it to the gate so
        # centrally-waived findings don't fail the build. FAIL-CLOSED — if the fetch fails we do NOT
        # apply waivers (the gate stays strict) and warn, so an unreachable hub can never silently
        # turn a red build green. The file lands in the workspace so it's visible inside the container.
        if [ "${INPUT_WAIVERS_ONLINE:-false}" = "true" ]; then
          if [ -z "${INPUT_REPORT_TO:-}" ] || [ -z "${DEPPROOF_REPORT_TOKEN:-}" ]; then
            echo "::warning::depproof-action: waivers-online needs report-to + report-token — skipping (gate stays strict)."
          else
            WAIVERS_URL="${INPUT_REPORT_TO%/scans}/waivers"
            if curl -fsS --max-time 20 \
                 -H "Authorization: Bearer ${DEPPROOF_REPORT_TOKEN}" \
                 "${WAIVERS_URL}?repo=${GITHUB_REPOSITORY:-}" \
                 -o "${GITHUB_WORKSPACE}/.depproof-waivers.json"; then
              ARGS+=("--waivers" "/workspace/.depproof-waivers.json")
              echo "depproof-action: applied hub waivers from ${WAIVERS_URL}"
            else
              echo "::warning::depproof-action: could not fetch waivers from the hub — gate stays strict (fail-closed)."
            fi
          fi
        fi

        # In-perimeter detection: the hub serves the advisories, the scanner matches versions.
        # Separate from enrichment below, and the order is why: /enrich is keyed on the finding ids,
        # and those do not exist until detection has run.
        if [ "${INPUT_DETECT_ONLINE:-false}" = "true" ]; then
          if [ -z "${INPUT_REPORT_TO:-}" ] || [ -z "${DEPPROOF_REPORT_TOKEN:-}" ]; then
            # A warning and the default path, not a silent one: without a hub there is still a working
            # detection route (OSV.dev), so falling back is honest — pretending we used the hub is not.
            echo "::warning::depproof-action: detect-online needs report-to + report-token — skipping (advisories will come from OSV.dev)."
          else
            ADVISORIES_URL="${INPUT_REPORT_TO%/scans}/advisories"
            ARGS+=("--advisories-from" "${ADVISORIES_URL}")
            echo "depproof-action: advisories will be served by the hub at ${ADVISORIES_URL} (no call to OSV.dev)"
          fi
        fi

        # Licences answered by the hub. Separate from enrichment below and from detection above,
        # because the three travel independently: a repository can take licences from the hub while
        # taking exploitation data from a prepared file, which is the common combination.
        if [ "${INPUT_LICENSES_ONLINE:-false}" = "true" ]; then
          if [ -z "${INPUT_REPORT_TO:-}" ] || [ -z "${DEPPROOF_REPORT_TOKEN:-}" ]; then
            # Warn and carry on with the default route: licences still resolve, just not via the hub.
            # Silently pretending otherwise would be worse than the slower path.
            echo "::warning::depproof-action: licenses-online needs report-to + report-token — skipping (licences will be fetched directly)."
          else
            LICENSES_URL="${INPUT_REPORT_TO%/scans}/enrich"
            ARGS+=("--licenses-from" "${LICENSES_URL}")
            echo "depproof-action: licences will be answered by the hub at ${LICENSES_URL}"
          fi
        fi

        # Online-mode enrichment: apply exploitation data from the hub. Unlike waivers this ADDS facts,
        # so it flows into the SBOM and report too, not just the gate.
        #
        # Two modes, differing in privacy rather than quality:
        #
        #   bulk     — fetch the whole catalogue here, before the scan, and let depproof match it
        #              locally. The hub never learns which CVEs this repo has. KEV only: the EPSS
        #              catalogue is ~355,000 entries and cannot be shipped per run.
        #   targeted — hand the URL to depproof, which asks the hub mid-scan once the finding ids
        #              exist. Required for EPSS. The hub learns the findings, and in exchange records
        #              precisely what this scan was told.
        #
        # Bulk is fetched here because the ids do not exist until after the scan, while args are built
        # before it — that ordering is the whole reason the two modes exist.
        if [ "${INPUT_ENRICH_ONLINE:-false}" = "true" ]; then
          if [ -z "${INPUT_REPORT_TO:-}" ] || [ -z "${DEPPROOF_REPORT_TOKEN:-}" ]; then
            echo "::warning::depproof-action: enrich-online needs report-to + report-token — skipping (no exploitation data applied)."
          else
            ENRICH_URL="${INPUT_REPORT_TO%/scans}/enrich"
            if [ "${INPUT_ENRICH_MODE:-bulk}" = "targeted" ]; then
              # depproof does the request itself, and fails closed (exit 4) if the hub is unreachable
              # AND a rule depends on it. The token reaches the container via -e, never on argv.
              ARGS+=("--enrich-from" "${ENRICH_URL}")
              ENRICH_APPLIED=1
              echo "depproof-action: enrichment will be fetched during the scan from ${ENRICH_URL} (targeted)"
            else
              # FAIL-CLOSED: on a failed fetch we apply nothing and warn loudly. A missing snapshot
              # must never read as "nothing is being exploited".
              if curl -fsS --max-time 30 -X POST \
                   -H "Authorization: Bearer ${DEPPROOF_REPORT_TOKEN}" \
                   -H "Content-Type: application/json" \
                   -d "{\"bulk\":true,\"want\":[\"kev\"],\"repo\":\"${GITHUB_REPOSITORY:-}\",\"commit\":\"${GITHUB_SHA:-}\"}" \
                   "${ENRICH_URL}" \
                   -o "${GITHUB_WORKSPACE}/.depproof-enrich.json"; then
                ARGS+=("--enrich" "/workspace/.depproof-enrich.json")
                ENRICH_APPLIED=1
                echo "depproof-action: applied hub enrichment from ${ENRICH_URL} (bulk)"
              else
                echo "::warning::depproof-action: could not fetch enrichment from the hub — no exploitation data applied (fail-closed)."
              fi
            fi
          fi
        fi

        # Coverage gating. Unlike the exploitation flags below, this needs no hub and no enrichment —
        # it is a fact about the manifest the scan just read, so it is passed through unconditionally
        # and the engine rejects an unrecognised value as a usage error rather than ignoring it.
        if [ -n "${{ inputs.require-fidelity }}" ] && [ "${{ inputs.require-fidelity }}" != "off" ]; then
          ARGS+=("--require-fidelity=${{ inputs.require-fidelity }}")
        fi

        # Source reachability. Passed ONLY when a value was stated: the flag is tri-state in the
        # engine, where "unstated" means "follow the findings gate" and is not the same as "off".
        # Sending off for a blank input would silently disable a control nobody switched off.
        #
        # Precedence: this repository's own input wins over the org policy fetched above. A repo may
        # opt into something STRICTER than the org requires; it can never talk itself down, because
        # the org value only reaches ORG_REQUIRE_ENRICHMENT when the hub said ENFORCE.
        REQUIRE_ENRICHMENT="${INPUT_REQUIRE_ENRICHMENT:-}"
        if [ -z "$REQUIRE_ENRICHMENT" ] && [ -n "${ORG_REQUIRE_ENRICHMENT:-}" ]; then
          REQUIRE_ENRICHMENT="${ORG_REQUIRE_ENRICHMENT}"
          echo "depproof-action: applying org policy require-enrichment=${REQUIRE_ENRICHMENT}"
        fi
        if [ -n "$REQUIRE_ENRICHMENT" ]; then
          ARGS+=("--require-enrichment=${REQUIRE_ENRICHMENT}")
        fi

        # Exploitation gating. Only passed when enrichment was actually arranged: the engine rejects
        # these flags without a source, so passing them after a failed fetch would turn a hub outage
        # into a usage error (exit 2) instead of a scan that simply could not check.
        if [ "${{ inputs.fail-on-kev }}" = "true" ]; then
          if [ "${ENRICH_APPLIED:-0}" = "1" ]; then
            ARGS+=("--fail-on-kev")
          else
            echo "::warning::depproof-action: fail-on-kev needs enrich-online with a reachable hub — not gating on exploitation this run."
          fi
        fi

        # EPSS needs targeted mode specifically: the bulk catalogue carries KEV only, so a bulk run
        # would pass the flag against data that can never contain a score, and every finding would
        # silently fail to match.
        if [ -n "${{ inputs.fail-on-epss }}" ]; then
          if [ "${ENRICH_APPLIED:-0}" != "1" ]; then
            echo "::warning::depproof-action: fail-on-epss needs enrich-online with a reachable hub — not gating on EPSS this run."
          elif [ "${INPUT_ENRICH_MODE:-bulk}" != "targeted" ]; then
            echo "::warning::depproof-action: fail-on-epss requires enrich-mode 'targeted' (bulk carries KEV only) — not gating on EPSS this run."
          else
            ARGS+=("--fail-on-epss" "${{ inputs.fail-on-epss }}")
          fi
        fi

        # Pull + run. The image is a multi-arch manifest at ghcr.io/depproof/depproof:v0.
        # `--rm` removes the container after exit. We mount the workspace read-write so SBOMs can
        # be written back; depproof doesn't modify the source itself.
        # The exit code is captured rather than allowed to propagate, because the surfaces below
        # matter MOST when the scan fails — letting `set -e` abort here would mean a failing build
        # renders nothing, which is the exact situation this exists to fix. Re-raised verbatim at
        # the end, so exit codes 1/2/3/4 keep their distinct meanings.
        set +e
        docker run --rm \
          "${DOCKER_ENV[@]}" \
          -v "${GITHUB_WORKSPACE}":/workspace \
          -w /workspace \
          ghcr.io/depproof/depproof:v0 \
          "${ARGS[@]}"
        DEPPROOF_EXIT=$?
        set -e

        # ---------------------------------------------------------------------------------------
        # Visibility. Everything below is best-effort: a rendering or API problem must never change
        # the verdict of a scan that already ran.
        # ---------------------------------------------------------------------------------------
        # The engine rendered the summary; this Action only decides where to put it. Everything the
        # display used to reason about — which verdict is authoritative, how findings rank, whether
        # absent data reads as clean — now lives in the engine, where the gate decision actually is,
        # and reaches every CI rather than this one.
        BODY_SH="${{ github.action_path }}/scripts/summary_body.sh"
        SUMMARY_MD="${OUTPUT_DIR}/depproof-summary.md"

        # Coverage, on the run page rather than only inside a page someone opens. The engine decides
        # whether there is a gap and what to do about it; this only lifts that decision to the one
        # surface a green build is actually looked at on. Never fails the step — the gate input
        # `require-fidelity` remains the only thing that can fail a build over coverage.
        bash "${{ github.action_path }}/scripts/coverage_annotation.sh" \
          "${OUTPUT_DIR}/depproof-summary.json" "${{ inputs.require-fidelity }}" || true

        # Source reachability, on the same surface and for a sharper version of the same reason. A
        # coverage gap means the findings came from part of the graph; an unreached source means they
        # came from no screen at all, and that is indistinguishable from a clean project unless
        # something says so where the green tick is. Never fails the step: the engine already decided
        # the verdict and exited 4 if it mattered.
        bash "${{ github.action_path }}/scripts/sources_annotation.sh" \
          "${OUTPUT_DIR}/depproof-summary.json" || true

        if [ "${{ inputs.job-summary }}" = "true" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          bash "$BODY_SH" "$SUMMARY_MD" "$DEPPROOF_EXIT" >> "$GITHUB_STEP_SUMMARY" \
            || echo "::warning::depproof-action: could not write the job summary"
        fi

        # PR number comes from the event payload; empty for every non-PR trigger, which is what
        # keeps 'auto' from trying to comment on a push or a schedule.
        PR_NUM="$(python3 -c 'import json,os; p=os.environ.get("GITHUB_EVENT_PATH",""); d=json.load(open(p)) if p and os.path.exists(p) else {}; print((d.get("pull_request") or {}).get("number") or "")' 2>/dev/null || true)"

        if [ "${{ inputs.pr-comment }}" != "false" ] && [ -n "$PR_NUM" ]; then
          BODY="$(mktemp)"
          if bash "$BODY_SH" "$SUMMARY_MD" "$DEPPROOF_EXIT" '<!-- depproof-action -->' \
               "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > "$BODY"; then
            # One comment per PR, updated in place. Without the marker lookup every push would add
            # another copy, and the action would become the thing everyone mutes.
            EXISTING="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUM}/comments" --paginate \
                          --jq '.[] | select(.body | contains("<!-- depproof-action -->")) | .id' \
                          2>/dev/null | head -1 || true)"
            if [ -n "$EXISTING" ]; then
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${EXISTING}" \
                -F body=@"$BODY" >/dev/null 2>&1 \
                || echo "::warning::depproof-action: could not update the PR comment — grant 'pull-requests: write' to enable it."
            else
              gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUM}/comments" \
                -F body=@"$BODY" >/dev/null 2>&1 \
                || echo "::warning::depproof-action: could not post the PR comment — grant 'pull-requests: write' to enable it."
            fi
          fi
          rm -f "$BODY"
        fi

        exit $DEPPROOF_EXIT
