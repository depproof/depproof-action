name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # These steps take about two seconds. Run #1 hung for 15 minutes and died with a GitHub
    # "Internal server error", burning the minutes and reporting a failure that had nothing to do
    # with the code. A cap turns that class of event into a fast, obvious infrastructure failure
    # instead of a slow ambiguous one.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Summary-body tests
        run: bash tests/test_summary_body.sh

      - name: Coverage-annotation tests
        run: bash tests/test_coverage_annotation.sh

      # The GitLab template carries its MR-comment script inline (a remote include fetches one file,
      # and a CI job that downloads code to execute is what this product warns about), so the test
      # extracts the heredoc and runs it against a stub API. It also checks the YAML parses and the
      # scan job's shell is valid — the same two-languages-in-one-file risk as action.yml.
      - name: GitLab template tests
        run: |
          python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml
          python3 - <<'PY'
          import yaml
          spec = yaml.safe_load(open("gitlab/depproof.gitlab-ci.yml"))
          open("/tmp/gl_scan.sh", "w").write(spec[".depproof"]["script"][0])
          print(f"template OK — {len([k for k in spec if not k.startswith('.')])} jobs")
          PY
          sh -n /tmp/gl_scan.sh
          python3 tests/test_gitlab_mr_note.py

      # The action is a composite whose body is one large bash script inside a YAML block scalar.
      # Both halves can break independently and neither shows up until a consumer's build fails:
      # a mis-indented heredoc breaks the YAML, and a typo breaks the shell. Cheap to check here.
      - name: action.yml parses, and its shell is syntactically valid
        run: |
          # PyYAML ships in the ubuntu-latest image, but this check exists to catch a broken
          # action.yml — it should not itself break silently if a future image drops the module.
          python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml
          python3 - <<'PY'
          import re, yaml
          spec = yaml.safe_load(open("action.yml"))
          script = spec["runs"]["steps"][0]["run"]
          # GitHub expressions are not shell; stub them before handing the body to bash -n.
          open("/tmp/step.sh", "w").write(re.sub(r"\$\{\{[^}]*\}\}", "STUB", script))
          print(f"action.yml OK — {len(spec['inputs'])} inputs")
          PY
          bash -n /tmp/step.sh
